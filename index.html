<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f3eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cave Daily">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Cave Daily / 山洞日報</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to stories</a>

  <header class="masthead">
    <div class="mast-rail">
      <time id="paper-date" datetime="2026-08-16">Sunday, 16 Aug 2026</time>
      <span class="lean-mark" title="Neutral, slightly left">Lean left</span>
    </div>

    <div class="nameplate">
      <p class="the">The</p>
      <h1>Cave Daily</h1>
      <p class="secondary-title">山洞日報</p>
      <p class="tagline">A paper for Taipei</p>
      <p class="install-hint" id="install-hint" hidden>
        <span>On your phone: Share, then Add to Home Screen.</span>
        <button type="button" class="install-hint-dismiss" id="install-hint-dismiss" aria-label="Dismiss">Dismiss</button>
      </p>
    </div>

    <div class="rule-double" aria-hidden="true"></div>

    <div class="toolbar">
      <div class="sections" role="group" aria-label="Section">
        <button type="button" id="tab-taiwan" aria-pressed="true" data-section="taiwan">台灣</button>
        <span class="section-sep" aria-hidden="true">|</span>
        <button type="button" id="tab-world" aria-pressed="false" data-section="world">World</button>
      </div>
      <div class="topics" role="group" aria-label="Topic filter" id="topic-filters">
        <button type="button" class="topic is-on" data-topic="all">All</button>
        <button type="button" class="topic" data-topic="finance">Finance</button>
        <button type="button" class="topic" data-topic="tech">Tech</button>
        <button type="button" class="topic" data-topic="politics">Politics</button>
        <button type="button" class="topic" data-topic="literature">Literature</button>
      </div>
      <p class="updated" id="updated-line" hidden></p>
    </div>
  </header>

  <div class="app">
    <main id="main">
      <p class="status" id="status-line" hidden></p>
      <div id="story-list" class="story-list"></div>
    </main>

    <aside id="explain-panel" class="explain" aria-labelledby="explain-heading">
      <div class="explain-head">
        <h2 id="explain-heading">Glossary</h2>
        <button type="button" class="explain-close" id="explain-close" aria-label="Close explanation">Close</button>
      </div>
      <div id="explain-body" class="explain-body" aria-live="polite">
        <p class="explain-empty">Select any words, or tap a dotted term.</p>
      </div>
    </aside>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>

  <script src="app.js"></script>
</body>
</html>
